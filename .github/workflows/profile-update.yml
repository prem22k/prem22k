name: Profile Analytics & Asset Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    name: Fetch Data & Build Profile Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup font subsetting (fonttools)
        run: |
          python -m pip install --quiet --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1

      - name: Stage 1 — Fetch Real GitHub Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-data.ts

      - name: Stage 2 — Generate Liquid Glass SVGs
        run: |
          node scripts/build-assets.mjs

      - name: Stage 3 — Validate Generated Output & Constraints
        run: |
          node scripts/validate.mjs

      - name: Stage 4 — Execute Automated Test Suite
        run: |
          node --test scripts/test/glass.test.ts

      - name: Stage 5 — Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Commit only when something visible changed (rendered assets or README).
          # profile.json timestamps change on every run, so they alone never trigger a commit.
          if [ -n "$(git status --porcelain assets/ README.md)" ]; then
            git add assets/ data/ .last-updated README.md
            git commit -m "chore(profile): automated refresh of analytics & vector assets [skip ci]" \
                       -m "Co-authored-by: prem22k <premsai224k@gmail.com>"
            git push origin main
          else
            echo "No changes detected in generated assets."
          fi
